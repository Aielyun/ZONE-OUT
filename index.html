<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZONE OUT · 咖啡馆/酒吧/清吧/书店 · 2023 家</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
<style>
  :root {
    --bg:#eef2f6; --card:#f8fbfd; --ink:#1e2a3a; --muted:#5d7a96;
    --accent:#2c5f8a; --accent2:#7fa8c9; --line:#cddbe8; --hi:#e3eef7;
    --header-bg:linear-gradient(135deg,#1a3a5c,#2c5f8a);
    --thead-bg:#dfe9f1; --hl-bg:#e8f0f7; --tip-bg:rgba(245,250,253,.95); --legend-bg:rgba(245,250,253,.93);
    /* 设计系统 token (4px 基准网格) */
    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-8:32px; --sp-12:48px;
    --r-sm:4px; --r-md:8px; --r-lg:12px; --r-full:999px;
    --sh-xs:0 1px 4px rgba(0,0,0,.08); --sh-sm:0 2px 8px rgba(0,0,0,.1); --sh-md:0 4px 16px rgba(0,0,0,.12); --sh-lg:0 12px 40px rgba(0,0,0,.3);
    --fs-cap:10px; --fs-body:13px; --fs-sub:15px; --fs-title:16px; --fs-disp:25px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
  header{background:var(--header-bg);color:#fff;padding:32px 20px 24px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.12);position:relative}
  header h1{margin:0 0 4px;font-size:25px;font-weight:700;letter-spacing:2px}
  header .sub{font-size:13px;opacity:.82;margin-bottom:2px;letter-spacing:1px}
  header .meta{margin-top:4px;font-size:12px;opacity:.7}
  .wrap{max-width:1280px;margin:0 auto;padding:16px 16px 60px}
  /* 控制面板折叠 */
  .panel-toggle-wrap{display:flex;justify-content:center;margin-bottom:8px}
  .panel-toggle{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:5px 14px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s;box-shadow:0 2px 6px rgba(0,0,0,.06)}
  .panel-toggle:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
  .panel-toggle .pt-arrow{transition:transform .25s;font-size:10px}
  .control-panel{max-height:1200px;overflow:hidden;transition:max-height .35s ease-out,opacity .25s ease-out;margin-bottom:8px}
  .control-panel.collapsed{max-height:0;opacity:0;margin-bottom:0}
  body.panel-collapsed .panel-toggle .pt-arrow{transform:rotate(180deg)}
  body.panel-collapsed .panel-toggle .pt-label{font-size:0}
  body.panel-collapsed .panel-toggle .pt-label::after{content:'展开控制面板';font-size:12px}
  /* 类别 tab */
  .cat-tabs{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0;justify-content:center}
  .cat-tab{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap}
  .cat-tab:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(111,78,55,.15)}
  .cat-tab.active{color:#fff;border-color:transparent;box-shadow:0 4px 16px rgba(0,0,0,.18)}
  .cat-tab .ci{font-size:15px}
  .cat-tab .cnt{background:rgba(0,0,0,.1);border-radius:999px;padding:0 8px;font-size:12px;font-weight:400}
  .cat-tab.active .cnt{background:rgba(255,255,255,.3)}
  /* 统计卡片 */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px;margin:16px 0}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 5px;text-align:center;transition:.15s;cursor:pointer}
  .stat:hover{transform:translateY(-2px);box-shadow:0 5px 16px rgba(111,78,55,.16);border-color:var(--accent2)}
  .stat.active{border-color:var(--cur-accent);background:var(--cur-accent);transform:translateY(-2px);box-shadow:0 5px 16px rgba(0,0,0,.2)}
  .stat.active .stat-n,.stat.active .stat-l{color:#fff}
  .stat:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
  .stat-n{font-size:16px;font-weight:700;color:var(--cur-accent)}
  .stat-l{font-size:12px;color:var(--muted);margin-top:2px}
  .map-wrap{position:relative;margin:0 0 16px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card);box-shadow:0 4px 16px rgba(0,0,0,.04)}
  #map{height:450px;width:100%}
  /* 暗色底图: 对瓦片反相+色相旋转 */
  .map-dark .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg);-webkit-filter:invert(1) hue-rotate(180deg)}
  .map-dark .leaflet-control-attribution{background:rgba(0,0,0,.4)!important;color:#aaa!important}
  /* 底图切换按钮 */
  .layer-switch{position:absolute;top:10px;right:10px;z-index:600;display:flex;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:3px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
  .layer-btn{background:none;border:none;padding:5px 10px;font-size:11px;color:var(--muted);cursor:pointer;border-radius:6px;font-family:inherit;font-weight:600;transition:.12s}
  .layer-btn:hover{color:var(--ink)}
  .layer-btn.active{background:var(--accent);color:#fff}
  .map-legend{position:absolute;left:12px;bottom:12px;z-index:500;background:var(--legend-bg);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:12px;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08);max-width:280px}
  .map-legend b{color:var(--cur-accent)}
  .toolbar{position:sticky;top:0;z-index:600;background:var(--bg);padding:12px 0;margin-bottom:6px;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--line)}
  .search{position:relative;max-width:560px}
  .search input{width:100%;padding:10px 16px 10px 38px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:var(--card);outline:none;transition:.15s}
  .search input:focus{border-color:var(--cur-accent);box-shadow:0 0 0 3px rgba(111,78,55,.12)}
  .search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:15px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;font-size:12px;cursor:pointer;transition:.15s;white-space:nowrap}
  .chip:hover{border-color:var(--accent2)}
  .chip.active{background:var(--cur-accent);color:#fff;border-color:var(--cur-accent)}
  .chip .cnt{background:rgba(0,0,0,.08);border-radius:999px;padding:0 6px;font-size:10px}
  .chip.active .cnt{background:rgba(255,255,255,.25)}
  .result-info{font-size:12px;color:var(--muted);margin:5px 2px 12px}
  .district{margin:24px 0 8px}
  .district h2{font-size:16px;margin:0 0 4px;display:flex;align-items:baseline;gap:10px}
  .district h2 .c{font-size:12px;color:var(--muted);font-weight:400}
  .district .bar{height:4px;border-radius:4px;width:60px;margin-bottom:10px}
  .town{margin:12px 0 7px;padding-left:12px;border-left:3px solid var(--line)}
  .town h3{font-size:13px;margin:0 0 5px;color:var(--ink);display:flex;align-items:baseline;gap:7px;font-weight:600}
  .town h3 .c{font-size:12px;color:var(--muted);font-weight:400}
  /* 店铺卡片 (替代原 table, 移动端友好) */
  .shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
  .shop-card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 13px;transition:.15s;cursor:pointer;position:relative;overflow:hidden}
  .shop-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--cur-accent);opacity:.5;transition:.15s}
  .shop-card:hover{transform:translateY(-2px);box-shadow:0 5px 16px rgba(0,0,0,.1);border-color:var(--accent2)}
  .shop-card:hover::before{opacity:1;width:4px}
  .shop-card.hl{background:var(--hl-bg);border-color:var(--cur-accent);box-shadow:0 0 0 2px var(--cur-accent),0 5px 16px rgba(0,0,0,.12);animation:hlPulse 1.2s ease-out}
  .shop-card.hl::before{opacity:1;width:4px}
  @keyframes hlPulse{0%{box-shadow:0 0 0 0 var(--cur-accent),0 5px 16px rgba(0,0,0,.12)}100%{box-shadow:0 0 0 6px transparent,0 5px 16px rgba(0,0,0,.12)}}
  .sc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
  .sc-cat{font-size:10px;font-weight:600;color:var(--cur-accent);background:var(--hi);padding:1px 7px;border-radius:999px}
  .sc-name{font-size:13px;font-weight:700;color:var(--ink);line-height:1.3;margin-bottom:2px}
  .sc-addr{font-size:12px;color:var(--muted);line-height:1.4;margin-bottom:6px}
  .sc-coord{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;color:var(--muted);margin-bottom:8px}
  .sc-actions{display:flex;gap:6px;flex-wrap:wrap}
  .fav-btn{background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;padding:0 2px;line-height:1;transition:.12s;font-family:inherit}
  .fav-btn:hover{transform:scale(1.2)}
  .fav-btn.on{color:#e74c3c}
  #favOnlyBtn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .maplink{display:inline-flex;align-items:center;gap:3px;font-size:10px;color:var(--cur-accent);text-decoration:none;border:1px solid var(--accent2);padding:3px 8px;border-radius:8px;background:none;cursor:pointer;font-family:inherit;transition:.12s}
  .maplink:hover{background:var(--cur-accent);color:#fff;border-color:var(--cur-accent)}
  .locate{display:inline-flex;align-items:center;gap:3px;font-size:10px;color:var(--cur-accent);text-decoration:none;border:1px solid var(--accent2);padding:3px 8px;border-radius:8px;background:none;cursor:pointer;font-family:inherit;transition:.12s}
  .locate:hover{background:var(--cur-accent);color:#fff;border-color:var(--cur-accent)}
  .empty{text-align:center;color:var(--muted);padding:48px 20px}
  .empty .em-icon{font-size:40px;margin-bottom:10px;opacity:.5}
  .empty .em-text{font-size:15px;margin-bottom:6px}
  .empty .em-hint{font-size:12px}
  .empty .em-actions{margin-top:16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .empty .em-btn{padding:7px 16px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;font-size:12px;cursor:pointer;font-family:inherit;transition:.15s}
  .empty .em-btn:hover{border-color:var(--accent2);color:var(--accent)}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:24px 4px;border-top:1px solid var(--line);margin-top:24px;line-height:1.8}
  @media(max-width:640px){.shop-grid{grid-template-columns:1fr}.shop-card{padding:12px 12px}.sc-name{font-size:15px}#map{height:330px}}
  .leaflet-popup-content{margin:8px 12px;font-size:13px;line-height:1.5}
  .leaflet-popup-content .pn-wrap{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
  .leaflet-popup-content .pn{font-weight:700;color:var(--ink);margin-bottom:3px;flex:1}
  .leaflet-popup-content .popup-fav{background:none;border:none;font-size:18px;cursor:pointer;padding:0;line-height:1;color:var(--muted);transition:.12s;font-family:inherit}
  .leaflet-popup-content .popup-fav:hover{transform:scale(1.15)}
  .leaflet-popup-content .popup-fav.on{color:#e74c3c}
  .leaflet-popup-content .pa{color:#5b4a3a;font-size:12px}
  .leaflet-popup-content .pt{color:var(--muted);font-size:10px;margin:2px 0}
  .leaflet-popup-content .pl{display:inline-block;margin-top:4px;font-size:12px;color:var(--accent);text-decoration:none;border:1px solid var(--accent2);padding:2px 7px;border-radius:8px}
  /* 心灵窗口: 评价区 */
  .soul-window{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
  .soul-window .sw-title{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:5px;display:flex;align-items:center;gap:4px}
  .soul-window .sw-list{max-height:140px;overflow-y:auto;margin-bottom:6px;font-size:12px;line-height:1.5}
  .soul-window .sw-item{padding:5px 7px;margin-bottom:4px;background:var(--hi);border-radius:8px;border-left:2px solid var(--accent2)}
  .soul-window .sw-item .sw-name{font-weight:600;color:var(--ink)}
  .soul-window .sw-item .sw-time{color:var(--muted);font-size:10px;margin-left:5px}
  .soul-window .sw-item .sw-text{color:var(--ink);margin-top:2px;word-break:break-word}
  .soul-window .sw-empty{color:var(--muted);font-size:10px;font-style:italic;padding:3px 0}
  .soul-window textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;padding:5px 7px;font-size:12px;font-family:inherit;resize:vertical;min-height:42px;background:var(--card);color:var(--ink)}
  .soul-window textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(111,78,55,.1)}
  .soul-window .sw-row{display:flex;gap:5px;margin-top:5px;align-items:center}
  .soul-window .sw-row input{flex:1;border:1px solid var(--line);border-radius:8px;padding:4px 7px;font-size:12px;font-family:inherit;background:var(--card);color:var(--ink)}
  .soul-window .sw-row input:focus{outline:none;border-color:var(--accent)}
  .soul-window .sw-btn{border:none;background:var(--accent);color:#fff;border-radius:8px;padding:5px 12px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:600;transition:.15s;white-space:nowrap}
  .soul-window .sw-btn:hover{opacity:.88}
  .soul-window .sw-btn:disabled{opacity:.5;cursor:not-allowed}
  /* 心灵窗口: popup 内精简版 (内嵌, 显示最新评价+快速输入) */
  .sw-inline{margin-top:10px;padding:8px 8px;border-top:1px solid var(--line);background:var(--hi);border-radius:0 0 6px 6px}
  .sw-inline .sw-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .sw-inline .sw-title{font-size:12px;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:4px}
  .sw-inline .sw-title .sw-count{background:var(--accent);color:#fff;border-radius:8px;padding:0 6px;font-size:10px;font-weight:700;line-height:15px;min-width:15px;text-align:center}
  .sw-inline .sw-more{font-size:10px;color:var(--muted);cursor:pointer;text-decoration:none}
  .sw-inline .sw-more:hover{color:var(--accent);text-decoration:underline}
  .sw-inline .sw-list{max-height:62px;overflow-y:auto;margin-bottom:6px}
  .sw-inline .sw-list::-webkit-scrollbar{width:3px}
  .sw-inline .sw-list::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
  .sw-inline .sw-item{padding:3px 5px;margin-bottom:3px;background:var(--card);border-radius:4px;border-left:2px solid var(--accent2)}
  .sw-inline .sw-item .sw-top{display:flex;align-items:baseline;gap:5px}
  .sw-inline .sw-item .sw-name{font-weight:600;color:var(--ink);font-size:10px}
  .sw-inline .sw-item .sw-time{color:var(--muted);font-size:10px}
  .sw-inline .sw-item .sw-text{color:var(--ink);font-size:10px;line-height:1.4;margin-top:1px;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .sw-inline .sw-empty{color:var(--muted);font-size:10px;font-style:italic;padding:2px 0}
  .sw-inline textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:4px;padding:4px 6px;font-size:10px;font-family:inherit;resize:vertical;min-height:30px;max-height:60px;background:var(--card);color:var(--ink);line-height:1.4}
  .sw-inline textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 1px rgba(111,78,55,.15)}
  .sw-inline .sw-row{display:flex;gap:4px;margin-top:4px;align-items:center}
  .sw-inline .sw-row input{flex:1;border:1px solid var(--line);border-radius:4px;padding:3px 6px;font-size:10px;font-family:inherit;background:var(--card);color:var(--ink);min-width:0}
  .sw-inline .sw-row input:focus{outline:none;border-color:var(--accent)}
  .sw-inline .sw-btn{border:none;background:var(--accent);color:#fff;border-radius:4px;padding:3px 10px;font-size:10px;cursor:pointer;font-family:inherit;font-weight:600;transition:.15s;white-space:nowrap;line-height:1.5}
  .sw-inline .sw-btn:hover{opacity:.88}
  .sw-inline .sw-btn:disabled{opacity:.5;cursor:not-allowed}
  /* 心灵窗口: 弹层 modal */
  .soul-modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:9999;padding:16px}
  .soul-modal.open{display:flex}
  .soul-modal-box{background:var(--card);border-radius:8px;box-shadow:0 12px 40px rgba(0,0,0,.3);width:100%;max-width:380px;max-height:80vh;display:flex;flex-direction:column;overflow:hidden}
  .soul-modal-header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--bg)}
  .soul-modal-title{font-size:12px;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:5px}
  .soul-modal-name{color:var(--ink);font-weight:600}
  .soul-modal-close{background:transparent;border:none;font-size:16px;color:var(--muted);cursor:pointer;padding:0 6px;line-height:1;font-family:inherit}
  .soul-modal-close:hover{color:var(--ink)}
  .soul-modal-body{padding:12px 16px;overflow-y:auto;flex:1}
  .soul-modal-body .sw-list{max-height:none;margin-bottom:8px}
  .soul-modal-body textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px;font-family:inherit;resize:vertical;min-height:50px;background:var(--card);color:var(--ink)}
  .soul-modal-body textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(111,78,55,.1)}
  .soul-modal-body .sw-row{display:flex;gap:6px;margin-top:6px;align-items:center}
  .soul-modal-body .sw-row input{flex:1;border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:12px;font-family:inherit;background:var(--card);color:var(--ink)}
  .soul-modal-body .sw-row input:focus{outline:none;border-color:var(--accent)}
  .soul-modal-body .sw-btn{border:none;background:var(--accent);color:#fff;border-radius:8px;padding:6px 16px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:600;transition:.15s;white-space:nowrap}
  .soul-modal-body .sw-btn:hover{opacity:.88}
  .soul-modal-body .sw-item{padding:7px 8px;margin-bottom:6px;background:var(--hi);border-radius:8px;border-left:3px solid var(--accent2)}
  .soul-modal-body .sw-item .sw-item-head{display:flex;align-items:center;gap:6px;margin-bottom:2px}
  .soul-modal-body .sw-item .sw-name{font-weight:600;color:var(--ink);font-size:12px}
  .soul-modal-body .sw-item .sw-time{color:var(--muted);font-size:10px}
  .soul-modal-body .sw-item .sw-shop{color:var(--accent);font-size:11px;font-weight:600;margin:3px 0}
  .soul-modal-body .sw-item .sw-locate{margin-left:auto;border:1px solid var(--accent2);background:none;color:var(--accent);border-radius:8px;padding:1px 8px;font-size:10px;cursor:pointer;font-family:inherit;transition:.12s}
  .soul-modal-body .sw-item .sw-locate:hover{background:var(--accent);color:#fff}
  .soul-modal-body .sw-item .sw-text{color:var(--ink);font-size:12px;line-height:1.5;margin-top:3px;word-break:break-word}
  .soul-modal-body .sw-empty{color:var(--muted);font-size:12px;font-style:italic;padding:4px 0}
  /* 地图 tab 切换 */
  .map-tabs{display:flex;gap:6px;justify-content:center;margin:16px 0 10px}
  .map-tab{flex:0 0 auto;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:7px 16px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s}
  .map-tab:hover{border-color:var(--accent)}
  .map-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .map-panel{display:none}

    arr.sort((a,b)=>(b.ts||0)-(a.ts||0));
    return arr;
  }catch(e){return [];}
}
function saveSoulReview(poiKey, name, text){
  const arr = getSoulReviews(poiKey);  // 已按 ts 降序
  arr.unshift({name: name||"匿名", text: text, ts: Date.now()});
  // 修剪: 仅保留最新 20 条, 防止 localStorage 超限
  if(arr.length > 20) arr.length = 20;
  try{ localStorage.setItem(soulKey(poiKey), JSON.stringify(arr)); }catch(e){}
}

const FAV_KEY="zoneout_favs";
function getFavs(){try{return JSON.parse(localStorage.getItem(FAV_KEY)||'[]');}catch(e){return [];}}
function isFav(poiKey){return getFavs().indexOf(poiKey)>=0;}
function toggleFav(poiKey){
  const f=getFavs(); const i=f.indexOf(poiKey);
  if(i>=0) f.splice(i,1); else f.push(poiKey);
  try{ localStorage.setItem(FAV_KEY,JSON.stringify(f)); }catch(e){}
  return i<0; // 返回是否已收藏
}

function fmtTime(ts){
  const d = new Date(ts);
  const p = n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}
// 相对时间 (用于全局评价列表)
function relTime(ts){
  const diff=Date.now()-ts, d=Math.floor(diff/86400000), h=Math.floor(diff/3600000), m=Math.floor(diff/60000);
  if(d>=1) return d+'天前';
  if(h>=1) return h+'小时前';
  if(m>=1) return m+'分钟前';
  return '刚刚';
}
// 收集所有店铺的心灵评价, 按时间倒序
function getAllSoulReviews(){
  const all=[];
  try{
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(!k || !k.startsWith(SOUL_PREFIX)) continue;
      const poiKey=k.slice(SOUL_PREFIX.length);
      let arr;
      try{ arr=JSON.parse(localStorage.getItem(k)||'[]'); }catch(e){ continue; }
      if(!Array.isArray(arr)) continue;
      // 反查店铺信息
      const shop=DATA.find(p=>(p.id||(p.n+'|'+p.d+'|'+p.la+'|'+p.ln))===poiKey);
      for(const r of arr){
        all.push({poiKey, shop:shop||null, name:r.name||'匿名', text:r.text, ts:r.ts||0});
      }
    }
  }catch(e){}
  all.sort((a,b)=>(b.ts||0)-(a.ts||0));
  return all;
}

// 按缩放级别 + 像素距离避让显示店名: 放大到一定级别后, 视口内互不重叠的点显示 permanent 店名
let _allNameTimer=null;
function syncAllNames(){
  if(_allNameTimer){ clearTimeout(_allNameTimer); }
  _allNameTimer = setTimeout(()=>{
    _allNameTimer=null;
    const z = mapAll.getZoom();
    // 缩放阈值: z>=13 才考虑显示店名 (低缩放点太密, 全显示会糊成一团)
    if(z < 13){
      // 关闭所有 permanent 店名, 改回 hover
      for(const cat of CATEGORIES){
        for(const mk of allMapMarkers[cat]){
          const tt = mk.getTooltip();
          if(tt && tt.options && tt.options.permanent){
            mk.unbindTooltip();
            mk.bindTooltip(mk._name, {direction:'right', offset:[6,0], className:'cfd-tip', opacity:0.97});
          }
        }
      }
      return;
    }
    // z>=13: 在视口内做距离避让, 像素距离 < 阈值则不显示店名 (避免重叠)
    // 缩放越大, 同地理距离对应像素越大, 阈值也相应放大
    const pxThr = 70 + (z - 13) * 8;  // z13:70px, z14:78px, z15:86px...
    const b = mapAll.getBounds().pad(0.1);
    // 收集视口内激活类别的散点
    const cand = [];
    for(const cat of CATEGORIES){
      if(!allCatActive.has(cat)) continue;
      for(const mk of allMapMarkers[cat]){
        const ll = mk.getLatLng();
        if(b.contains(ll)){
          const pt = mapAll.latLngToContainerPoint(ll);
          cand.push({mk, pt});
        }
      }
    }
    // 按距离避让: 简单贪心, 先随机顺序处理, 标记每个被选中的点, 后续点与已选点距离 < 阈值则跳过
    const shown = [];
    const showSet = new Set();
    for(const item of cand){
      let ok = true;
      for(const s of shown){
        const dx = item.pt.x - s.pt.x, dy = item.pt.y - s.pt.y;
        if(dx*dx + dy*dy < pxThr*pxThr){ ok = false; break; }
      }
      if(ok){ shown.push(item); showSet.add(item.mk); }
    }
    // 应用: 命中 showSet 的开 permanent, 其余关 permanent 改 hover
    for(const item of cand){
      const mk = item.mk;
      const tt = mk.getTooltip();
      const wantPerm = showSet.has(mk);
      const curPerm = !!(tt && tt.options && tt.options.permanent === true);
      if(wantPerm && !curPerm){
        mk.unbindTooltip();
        mk.bindTooltip(mk._name, {permanent:true, direction:'right', offset:[6,0], className:'cfd-tip-perm', opacity:0.96});
      } else if(!wantPerm && curPerm){
        mk.unbindTooltip();
        mk.bindTooltip(mk._name, {direction:'right', offset:[6,0], className:'cfd-tip', opacity:0.97});
      }
    }
  }, 120);
}

function bindCardMarkerLinkage(){
  // 卡片点击 -> 地图定位+打开popup (等同于"在地图定位")
  listEl.addEventListener('click', e=>{
    // 收藏按钮
    const favBtn=e.target.closest('.fav-btn');
    if(favBtn){
      const poiKey=favBtn.dataset.poikey;
      const on=toggleFav(poiKey);
      favBtn.classList.toggle('on',on);
      favBtn.textContent=on?'♥':'♡';
      favBtn.setAttribute('aria-pressed', String(on));
      favBtn.setAttribute('aria-label', (on?'取消收藏':'收藏')+' '+favBtn.closest('.shop-card').dataset.name);
      // 如果当前是仅收藏视图, 取消收藏后需要重新渲染
      if(curFavOnly && !on) render();
      else { const c=document.getElementById('favCnt'); if(c) c.textContent=getFavs().length; }
      return;
    }
    const card=e.target.closest('.shop-card');
    if(!card) return;
    if(e.target.closest('.locate') || e.target.closest('.maplink')) return; // 按钮自己处理
    const la=parseFloat(card.dataset.lat), ln=parseFloat(card.dataset.lng);
    if(!isFinite(la)||!isFinite(ln)) return;
    const m=allMarkers.find(o=>o.la===la && o.ln===ln && o.n===card.dataset.name);
    if(!m) return;
    _scrollToClusterMap();
    setTimeout(()=>{
      map.invalidateSize();
      const doLocate=()=>{map.setView([la,ln],Math.max(map.getZoom(),16),{animate:true});m.marker.openPopup();};
      if(clusterGroup.getVisibleParent(m.marker) instanceof L.MarkerCluster){clusterGroup.zoomToShowLayer(m.marker,doLocate);}
      else doLocate();
    },320);
  });
  // 卡片 hover -> 对应标记放大发光
  listEl.addEventListener('mouseover', e=>{
    const card=e.target.closest('.shop-card');
    if(!card) return;
    const la=parseFloat(card.dataset.lat), ln=parseFloat(card.dataset.lng);
    const m=allMarkers.find(o=>o.la===la && o.ln===ln && o.n===card.dataset.name);
    if(m && map.hasLayer(m.marker)){
      const el=m.marker.getElement();
      if(el){ const pin=el.querySelector('.cfd-pin'); if(pin){pin.style.transform='scale(1.8)';pin.style.boxShadow='0 0 8px 3px var(--cur-accent)';} }
    }
  });
  listEl.addEventListener('mouseout', e=>{
    const card=e.target.closest('.shop-card');
    if(!card) return;
    const la=parseFloat(card.dataset.lat), ln=parseFloat(card.dataset.lng);
    const m=allMarkers.find(o=>o.la===la && o.ln===ln && o.n===card.dataset.name);
    if(m){
      const el=m.marker.getElement();
      if(el){ const pin=el.querySelector('.cfd-pin'); if(pin){pin.style.transform='';pin.style.boxShadow='';} }
    }
  });
}

function matchQ(p,q){return !q || (p.n||"").toLowerCase().includes(q) || (p.a||"").toLowerCase().includes(q);}

function catFiltered(cat){
  if(cat==="__all__") return DATA;
  return DATA.filter(p=>p.c===cat);
}

function render(){
  const q=curQ.trim().toLowerCase();
  let base = catFiltered(curCat);
  if(curDistrict!=="__all__") base = base.filter(p=>p.d===curDistrict);
  let items = base.filter(p=>matchQ(p,q));
  // 仅收藏筛选
  if(curFavOnly){
    const favs=getFavs();
    items=items.filter(p=>favs.indexOf(p.id||(p.n+'|'+p.d+'|'+p.lat+'|'+p.lng))>=0);
  }
  // 更新收藏计数
  const favCntEl=document.getElementById('favCnt');
  if(favCntEl) favCntEl.textContent=getFavs().length;

  // 统计卡片数量(随当前类别)
  updateStatsCount();

  let out="", totalShown=0;
  for(const d of ORDER){
    const di = items.filter(p=>p.d===d);
    if(!di.length) continue;
    totalShown+=di.length;
    const townMap={};
    for(const p of di){(townMap[p.t]=townMap[p.t]||[]).push(p);}
    const towns=Object.keys(townMap).sort((a,b)=>townMap[b].length-townMap[a].length || a.localeCompare(b,'zh'));
    const curCol = curCat==="__all__" ? "#2c5f8a" : ccolor(curCat);
    out += '<div class="district"><h2>'+d+' <span class="c">'+di.length+' 家 · '+towns.length+' 个镇/街道</span></h2><div class="bar" style="background:linear-gradient(90deg,'+curCol+','+curCol+'99)"></div>';
    for(const t of towns){
      const ti=townMap[t];
      let cards="";
      ti.forEach(p=>{
        const mapurl = p.lng ? ("https://uri.amap.com/marker?position="+p.lng+","+p.lat+"&name="+encodeURIComponent(p.n||"")+"&coordinate=wgs84&callnative=1") : "#";
        const catBadge = curCat==="__all__" ? '<span class="sc-cat" style="color:'+ccolor(p.c)+'">'+cicon(p.c)+' '+esc(p.c)+'</span>' : '<span class="sc-cat">'+cicon(curCat)+' '+esc(curCat)+'</span>';
        const coord = p.lng ? (p.lng+', '+p.lat) : '';
        const locateBtn = p.lng ? '<button class="locate" data-lat="'+p.lat+'" data-lng="'+p.lng+'" data-n="'+esc(p.n)+'" data-d="'+d+'" aria-label="在地图上定位 '+esc(p.n)+'">📍 在地图定位</button>' : '';
        const amapLink = p.lng ? '<a class="maplink" href="'+mapurl+'" target="_blank" rel="noopener" aria-label="在高德地图中打开 '+esc(p.n)+'">高德地图</a>' : '';
        const poiKey = (p.id || (p.n+'|'+p.d+'|'+p.lat+'|'+p.lng));
        const fav = isFav(poiKey);
        const favBtn = '<button class="fav-btn'+(fav?' on':'')+'" data-poikey="'+esc(poiKey)+'" aria-label="'+(fav?'取消收藏':'收藏')+' '+esc(p.n)+'" aria-pressed="'+(fav?'true':'false')+'">'+(fav?'♥':'♡')+'</button>';
        cards += '<div class="shop-card" data-name="'+esc(p.n)+'" data-d="'+d+'" data-lat="'+p.lat+'" data-lng="'+p.lng+'">'
          + '<div class="sc-head">'+catBadge+favBtn+'</div>'
          + '<div class="sc-name">'+esc(p.n)+'</div>'
          + '<div class="sc-addr">'+esc(p.a||"地址不详")+'</div>'
          + (coord ? '<div class="sc-coord">'+coord+'</div>' : '')
          + '<div class="sc-actions">'+locateBtn+amapLink+'</div>'
          + '</div>';
      });
      out += '<div class="town" style="border-left-color:'+curCol+'55"><h3>'+t+' <span class="c">'+ti.length+' 家</span></h3>'
        + '<div class="shop-grid">'+cards+'</div></div>';
    }
    out += '</div>';
  }
  if(!totalShown){
    const hasFilter = curCat!=="__all__" || curDistrict!=="__all__" || q;
    out='<div class="empty"><div class="em-icon">🔍</div><div class="em-text">未找到匹配的场所</div><div class="em-hint">试试别的关键词、类别或区县</div>'
      + '<div class="em-actions">'
      + (q ? '<button class="em-btn" id="emClearQ">清除搜索</button>' : '')
      + (hasFilter ? '<button class="em-btn" id="emReset">重置筛选</button>' : '')
      + '<button class="em-btn" id="emBrowse">浏览全部</button>'
      + '</div></div>';
  }
  listEl.innerHTML=out;
  const cLabel = curCat==="__all__" ? "全部类别" : curCat;
  const dLabel = curDistrict==="__all__" ? "全部区县" : curDistrict;
  infoEl.innerHTML = (q ? '搜索 “<b>'+esc(curQ)+'</b>” · ' : '') + cLabel + ' / ' + dLabel + ' · 列表 <b>'+totalShown+'</b> 家 / 地图 <b>'+currentVisibleMarkers().length+'</b> 家';
  updateMap();
}

function updateStatsCount(){
  // 统计卡片 + chip 数字 = 当前类别下各区县数量
  const dCounts = {};
  for(const d of ORDER){
    let s=0;
    if(curCat==="__all__"){ for(const c of CATEGORIES) s += (CAT_DIST[c]||{})[d]||0; }
    else { s = (CAT_DIST[curCat]||{})[d]||0; }
    dCounts[d]=s;
  }
  // 更新统计卡片
  document.querySelectorAll(".stat").forEach(s=>{
    const d=s.dataset.district;
    const n=s.querySelector(".stat-n"); if(n) n.textContent=dCounts[d]||0;
  });
  // 更新区县 chip 的 .cnt
  document.querySelectorAll(".chip").forEach(c=>{
    const d=c.dataset.district;
    const cnt=c.querySelector(".cnt"); if(cnt) cnt.textContent=dCounts[d]||0;
  });
  // 全部 chip 数量
  const total = curCat==="__all__" ? 2023 : (CAT_DIST[curCat] ? Object.values(CAT_DIST[curCat]).reduce((a,b)=>a+b,0) : 0);
  const allChip=$("#chipAll"); if(allChip) allChip.textContent=total;
}

function setCat(c){
  curCat=c;
  document.querySelectorAll(".cat-tab").forEach(t=>{
    const on = t.dataset.cat===c;
    t.classList.toggle("active", on);
    t.setAttribute("aria-pressed", String(on));
    // active tab 设背景色, 非active清除inline背景
    if(on) t.style.background = c==="__all__" ? THEMES[curTheme].accent : ccolor(c);
    else t.style.background = "";
  });
  const col = c==="__all__" ? THEMES[curTheme].accent : ccolor(c);
  document.documentElement.style.setProperty("--cur-accent", col);
  // 重置区县选择
  curDistrict="__all__";
  document.querySelectorAll(".chip").forEach(ch=>{ch.classList.toggle("active", ch.dataset.district==="__all__");if(ch.dataset.district)ch.setAttribute("aria-pressed",String(ch.dataset.district==="__all__"));});
  document.querySelectorAll(".stat").forEach(s=>{s.classList.remove("active");s.setAttribute("aria-pressed","false");});
  updateHash();
  render();
  _scrollToClusterMap();
}
function setDistrict(d){
  curDistrict=d;
  document.querySelectorAll(".chip").forEach(c=>{if(!c.dataset.district)return;const on=c.dataset.district===d;c.classList.toggle("active",on);c.setAttribute("aria-pressed",String(on));});
  document.querySelectorAll(".stat").forEach(c=>{const on=c.dataset.district===d;c.classList.toggle("active",on);c.setAttribute("aria-pressed",String(on));});
  updateHash();
  render();
  _scrollToClusterMap();
}
// 筛选条件持久化到 URL hash (分享链接保留状态)
function updateHash(){
  const parts=[];
  if(curCat!=="__all__") parts.push("cat="+encodeURIComponent(curCat));
  if(curDistrict!=="__all__") parts.push("d="+encodeURIComponent(curDistrict));
  if(curQ) parts.push("q="+encodeURIComponent(curQ));
  const h=parts.join("&");
  history.replaceState(null,"", h ? "#"+h : window.location.pathname+window.location.search);
}
function applyHash(){
  const h=window.location.hash.slice(1);
  if(!h) return;
  const p={};
  h.split("&").forEach(kv=>{const i=kv.indexOf("=");if(i>0)p[kv.slice(0,i)]=decodeURIComponent(kv.slice(i+1));});
  if(p.cat && document.querySelector('.cat-tab[data-cat="'+esc(p.cat)+'"]')){
    curCat=p.cat;
    document.querySelectorAll(".cat-tab").forEach(t=>{
      const on=t.dataset.cat===curCat;
      t.classList.toggle("active",on);
      if(on) t.style.background=curCat==="__all__"?THEMES[curTheme].accent:ccolor(curCat);
      else t.style.background="";
    });
    const col=curCat==="__all__"?THEMES[curTheme].accent:ccolor(curCat);
    document.documentElement.style.setProperty("--cur-accent",col);
  }
  if(p.d && document.querySelector('.chip[data-district="'+esc(p.d)+'"]')){
    curDistrict=p.d;
    document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("active",c.dataset.district===curDistrict));
    document.querySelectorAll(".stat").forEach(c=>c.classList.toggle("active",c.dataset.district===curDistrict));
  }
  if(p.q!==undefined){
    curQ=p.q;
    const qi=document.getElementById("q"); if(qi) qi.value=curQ;
  }
}
// 切到聚合地图 tab 并平滑滚动到地图位置
function _scrollToClusterMap(){
  const clusterTab=document.querySelector('.map-tab[data-tab="cluster"]');
  if(clusterTab && !clusterTab.classList.contains('active')) clusterTab.click();
  const mapWrap=document.querySelector('#panel-cluster .map-wrap');
  if(mapWrap) mapWrap.scrollIntoView({behavior:'smooth', block:'start'});
}

listEl.addEventListener("click", e=>{

});

// 冷暖色调切换: 替换 CSS 变量 + 类别色 + 重新着色地图标记 + 更新图例/按钮文字
function applyTheme(name){
  curTheme = name;
  const T = THEMES[name] || THEMES.cool;
  const root = document.documentElement.style;
  root.setProperty("--bg", T.bg);
  root.setProperty("--card", T.card);
  root.setProperty("--ink", T.ink);
  root.setProperty("--muted", T.muted);
  root.setProperty("--accent", T.accent);
  root.setProperty("--accent2", T.accent2);
  root.setProperty("--line", T.line);
  root.setProperty("--hi", T.hi);
  root.setProperty("--header-bg", T.headerBg);
  root.setProperty("--thead-bg", T.theadBg);
  root.setProperty("--hl-bg", T.hlBg);
  root.setProperty("--tip-bg", T.tipBg);
  root.setProperty("--legend-bg", T.legendBg);
  // 更新类别色
  for(const c of CATEGORIES) CAT_COLOR[c] = T.cat[c];
  const curAcc = curCat==="__all__" ? T.accent : T.cat[curCat];
  root.setProperty("--cur-accent", curAcc);
  // 重着色 主地图 markers (div pin)
  for(const m of allMarkers){
    const col = ccolor(m.c);
    const pin = m.marker.getElement && m.marker.getElement();
    if(pin){
      const sp = pin.querySelector('.cfd-pin'); if(sp) sp.style.background = col;
    }
    // 重建 icon 以保证颜色更新 (divIcon 内容不会自动重渲染)
    m.marker.setIcon(L.divIcon({className:'cfd-div', html:'<span class="cfd-pin" style="background:'+col+'"></span>', iconSize:[14,14], iconAnchor:[7,7]}));
  }
  // 重着色 全量总览地图 circleMarkers
  for(const cat of CATEGORIES){
    allMapMarkers[cat].forEach(mk=>{
      mk.setStyle({fillColor: ccolor(cat)});
    });
  }
  // 更新图例圆点颜色
  const dotAll = document.getElementById('dotAll');
  if(dotAll) dotAll.style.background = T.accent;
  document.querySelectorAll('.allcat-toggle .dot').forEach(d=>{
    const c = d.parentElement.dataset.cat;
    if(c && c!=="__all__") d.style.background = ccolor(c);
  });
  // 更新按钮文字
  const btn = document.getElementById('themeBtn');
  if(btn){ btn.textContent = name==="cool" ? "☾ 切换暖色调" : "☀ 切换冷色调"; }
  // 重渲染列表 (店名右侧色块/标签等)
  render();
}
document.getElementById('themeBtn').addEventListener('click', ()=>{
  applyTheme(curTheme==="cool" ? "warm" : "cool");
});

(function(){
  const el=document.getElementById('fetchTime');
  if(!el) return;
  const t=new Date(el.dataset.fetch).getTime();
  if(!isFinite(t)){el.textContent='抓取于 2026-09-29';return;}
  const diff=Date.now()-t, d=Math.floor(diff/86400000), h=Math.floor(diff/3600000), m=Math.floor(diff/60000);
  let txt;
  if(d>30) txt='抓取于 2026-09-29';
  else if(d>=1) txt=d+'天前更新';
  else if(h>=1) txt=h+'小时前更新';
  else if(m>=1) txt=m+'分钟前更新';
  else txt='刚刚更新';
  el.textContent=txt;
})();

// 底图切换 (标准/卫星/暗色)
function setMapStyle(style, target){
  const isCluster = target==='map';
  const m = isCluster ? map : mapAll;
  const wrap = (isCluster ? document.getElementById('panel-cluster') : document.getElementById('panel-overview')).querySelector('.map-wrap');
  wrap.querySelectorAll('.layer-btn').forEach(b=>{const on=b.dataset.style===style;b.classList.toggle('active',on);b.setAttribute('aria-pressed',String(on));});
  wrap.classList.toggle('map-dark', style==='dark');
  const tile = isCluster ? curTile : curTileAll;
  const sat  = isCluster ? curSat  : curSatAll;
  if(style==='sat'){
    if(tile) m.removeLayer(tile);
    if(!sat){
      if(isCluster){ curSat=mkLayer(TILE_SAT); curSat.addTo(m); }
      else { curSatAll=mkLayer(TILE_SAT); curSatAll.addTo(m); }
    } else sat.addTo(m);
  }else{
    const curSatRef = isCluster ? curSat : curSatAll;
    if(curSatRef) m.removeLayer(curSatRef);
    if(tile){ if(!m.hasLayer(tile)) tile.addTo(m); }
    else{
      if(isCluster){ curTile=mkLayer(TILE_STD); curTile.addTo(m); }
      else { curTileAll=mkLayer(TILE_STD); curTileAll.addTo(m); }
    }
  }
}
document.querySelectorAll('.layer-switch').forEach(sw=>{
  sw.addEventListener('click', e=>{
    const b=e.target.closest('.layer-btn'); if(!b) return;
    setMapStyle(b.dataset.style, sw.dataset.target);
  });
});
